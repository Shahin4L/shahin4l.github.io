:root{--navy:#102441;--blue:#235da6}body{background:#eef2f8;color:var(--navy);font-family:Inter,"Segoe UI",sans-serif}header{background:#fff;max-width:none;padding:16px max(20px,calc((100vw - 1210px)/2));border-color:#dbe4ef}header strong{font-size:21px}main{gap:24px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}section,aside{border-color:#dbe4ef;box-shadow:0 8px 30px #1024410a}h1{font:700 clamp(28px,4vw,43px)/1.12 Inter,"Segoe UI",sans-serif;letter-spacing:-.04em}button.primary{background:var(--blue);border-color:var(--blue)}button:hover{border-color:var(--blue)}:focus-visible{outline:3px solid #5894df;outline-offset:2px}progress{accent-color:var(--blue)}aside{position:sticky;top:18px;background:#e5ecf5}article{background:#fff;min-height:490px;padding:28px;margin-top:12px;border:1px solid #d1dceb;font-size:13px}article h2{margin:0;font-size:25px;letter-spacing:-.02em}article h4{margin:4px 0;color:#385578}article h3{border-color:#c5d0de;font-size:14px}article strong{display:block;margin-top:7px}.import-card{background:#f4f7fc;border:1px solid #d9e5f5;border-radius:10px;padding:16px;margin:16px 0}.import-card h2{font-size:17px;margin:0}.import-card p{font-size:14px;margin:6px 0}.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.steps button{font-size:12px;padding:5px 8px}.steps [aria-current]{background:#e2edfc;border-color:#6f99ce}.review-list{padding-left:20px}.review-list li{margin:5px 0}@media(max-width:800px){main{grid-template-columns:1fr}aside{position:static}article{min-height:280px}}

<header><a href="/">← Portfolio</a><strong>CV Studio</strong><button id="account">Sign in</button></header>
<main><section><small id="count"></small><progress id="progress" max="8"></progress><nav class="steps" id="steps" aria-label="CV sections"></nav><h1 id="heading"></h1><form id="form"></form><div class="actions"><button id="back">Back</button><button class="primary" id="next">Continue</button><button id="save">Save CV</button></div><output id="status" role="status"></output></section><aside><small>LIVE PREVIEW</small><article id="paper"></article></aside></main>
<dialog id="login"><h2>Your CV workspace</h2><p>Access lasts two calendar months from first use. Saved CV data is erased after three months.</p><form id="auth"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="6" autocomplete="current-password"></label><div class="actions"><button class="primary" value="in">Sign in</button><button value="up">Create account</button></div></form><output id="message"></output><button id="closeLogin">Close</button></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.12/build/pdfmake.min.js"></script><script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.12/build/vfs_fonts.js"></script>
<script type="module">
const $=id=>document.getElementById(id);
const db=window.supabase?.createClient('https://gckaucdwkyhmctfnimbb.supabase.co','sb_publishable_gm2VHpWs9jnyo5CSJ6P1WA_jpBLwoM0',{auth:{storageKey:'cv-studio-session',detectSessionInUrl:true}});
const regions=['Bangladesh / South Asia','USA / Canada','Europe','UK','UAE / GCC'],templates=['Classic','Editorial','Executive'];
const titles=['Target role','Contact details','Professional summary','Work experience','Education and certifications','Skills','Projects and accomplishments','Review and download'];
const initial=()=>({region:regions[0],template:templates[0],jobs:[{}],study:[{}],projects:[{}]});
let d=initial(),step=0,user,engine,busy=false,visited=0,importText='',importReading=false;
const elem=(tag,txt)=>{const n=document.createElement(tag);if(txt)n.textContent=txt;return n};
function field(parent,obj,key,label,kind='input',options=[]){const l=elem('label',label),n=elem(kind);if(kind==='select')options.forEach(v=>n.add(new Option(v,v)));n.value=obj[key]||'';n.oninput=()=>{obj[key]=n.value;preview()};l.append(n);parent.append(l);return n}
function button(parent,label,fn){let b=elem('button',label);b.type='button';b.onclick=fn;parent.append(b);return b}
function entries(key,title,fields){d[key].forEach((o,i)=>{let box=elem('fieldset');box.append(elem('legend',title+' '+(i+1)));fields.forEach(([k,l,t])=>field(box,o,k,l,t));if(key!=='study')ai(box,o,'detail');button(box,'Remove',()=>{d[key].splice(i,1);render()});form.append(box)});button(form,'Add '+title.toLowerCase(),()=>{d[key].push({});render()})}
function ai(box,o,k){let b=button(box,'Suggest AI revision',async()=>{if(!o[k]?.trim())return say('Enter a draft first.');if(!navigator.gpu)return say('AI revision needs a WebGPU-enabled browser.');b.disabled=true;try{say('Loading the on-device language model. The first use requires a model download.');const lib=await import('https://esm.run/@mlc-ai/web-llm@0.2.79');const model=lib.prebuiltAppConfig.model_list.find(m=>/^Qwen2.5-0.5B-Instruct-q4f(32|16)_1/.test(m.model_id))||lib.prebuiltAppConfig.model_list.find(m=>/^Llama-3.2-1B-Instruct-q4/.test(m.model_id));engine??=await lib.CreateMLCEngine(model.model_id,{initProgressCallback:p=>say(p.text)});const r=await engine.chat.completions.create({messages:[{role:'system',content:'Edit the provided CV text for clarity and relevant professional terminology. Use action verbs. Preserve facts. Never invent metrics, skills or achievements. Return only revised text.'},{role:'user',content:'Target role: '+(d.role||'')+'\nText: '+o[k]}],max_tokens:700,temperature:.2});let s=r.choices[0].message.content.trim();const suggestion=elem('fieldset');suggestion.append(elem('legend','Review suggestion'),elem('p',s));button(suggestion,'Use revision',()=>{o[k]=s;render()});button(suggestion,'Dismiss',()=>suggestion.remove());box.append(suggestion);say('')}catch{say('AI could not load. Check browser GPU support, memory and network access.')}finally{b.disabled=false}})}
const form=$('form');form.onsubmit=e=>e.preventDefault();
function render(){form.replaceChildren();$('heading').textContent=titles[step];$('count').textContent='STEP '+(step+1)+' OF 8';$('progress').value=step+1;$('back').disabled=!step;$('next').textContent=step===7?'Download PDF':'Continue';
const steps=$('steps');steps.replaceChildren();
const labels=['Target','Contact','Summary','Experience','Education','Skills','Projects','Review'];
labels.forEach((label,i)=>{const b=button(steps,label,()=>{step=i;say('');render()});b.disabled=i>visited;if(i===step)b.setAttribute('aria-current','step')});
switch(step){case 0:importPanel();field(form,d,'role','Which role are you applying for?');field(form,d,'region','Target market','select',regions);field(form,d,'posting','Job description (optional)','textarea');form.append(elem('small','Paste the vacancy to check whether relevant terms appear in your CV.'));break;
case 1:for(const [k,l] of [['name','Full name'],['email','Contact email'],['phone','Phone with country code'],['location','City and country'],['link','Professional profile or portfolio']])field(form,d,k,l);if(d.region===regions[4])field(form,d,'permit','Work authorization (optional)');break;
case 2:field(form,d,'summary','What experience and strengths would you bring to this role?','textarea');ai(form,d,'summary');break;
case 3:entries('jobs','Position',[['title','Job title'],['company','Employer'],['dates','Dates (month and year)'],['detail','Achievements, one per line','textarea']]);break;
case 4:entries('study','Qualification',[['title','Degree or certification'],['company','Institution or issuer'],['dates','Dates'],['detail','Additional details','textarea']]);break;
case 5:field(form,d,'skills','Technical and interpersonal skills','textarea');if(d.region===regions[2]||d.languages)field(form,d,'languages','Languages and proficiency');break;
case 6:entries('projects','Project',[['title','Project or accomplishment'],['detail','Contribution and outcome','textarea']]);break;
case 7:field(form,d,'template','Choose a template','select',templates);reviewPanel();break}if(d.unmapped&&step>0){const note=elem('details');note.open=step===1;note.append(elem('summary','Imported text to review'));field(note,d,'unmapped','Move relevant details into the appropriate fields. This text stays out of the PDF.','textarea');form.append(note)}preview()}

function importPanel(){
 const box=elem('div');box.className='import-card';
 box.append(elem('h2','Start with an existing CV'),elem('p','Import a text-based PDF, DOCX or TXT file up to 10 MB. The file is read in your browser.'));
 const input=elem('input');input.type='file';input.accept='.pdf,.docx,.txt';input.setAttribute('aria-label','Upload existing CV');
 input.disabled=importReading;
 input.onchange=async()=>{
   const file=input.files[0];if(!file)return;
   importReading=true;input.disabled=true;say('Reading your CV…');
   try{importText=await extractText(file);say(importText.trim()?'Text extracted. Review it before importing.':'No text found. Paste the text or use a searchable copy.')}
   catch(e){say(e.message+' You can paste the CV text below.')}
   finally{importReading=false;render()}
 };
 const label=elem('label','Review or paste extracted text'),area=elem('textarea');area.value=importText;
 area.oninput=()=>{importText=area.value};label.append(area);
 box.append(input,label);
 button(box,'Import into draft',()=>{
   if(!importText.trim())return say('Upload a file or paste your CV text first.');
   const imported=parseCv(importText);
   if(lines().some(l=>l.type!=='role')&&!confirm('Replace the current CV details with this import?'))return;
   d={...initial(),...imported,region:d.region,template:d.template,role:d.role,posting:d.posting};
   importText='';step=1;visited=7;render();
   say('Review names, dates and section placement before exporting. Text that needs sorting is shown below.');
 });
 form.append(box);
}
async function extractText(file){
 if(file.size>10*1024*1024)throw Error('This file exceeds 10 MB.');
 const ext=file.name.split('.').pop().toLowerCase();
 if(ext==='txt')return (await file.text()).slice(0,60000);
 if(ext==='pdf'){
   const base='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/';
   const pdf=await import(base+'pdf.min.mjs');
   pdf.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.mjs';
   const doc=await pdf.getDocument({data:await file.arrayBuffer(),isEvalSupported:false}).promise;
   try{
     if(doc.numPages>30)throw Error('Import supports PDFs of up to 30 pages.');
     const pages=[];
     for(let i=1;i<=doc.numPages;i++){
       const page=await doc.getPage(i),content=await page.getTextContent();
       let previousY,line='',rows=[];
       for(const item of content.items){
         if(!('str' in item))continue;
         const y=item.transform[5];
         if(line&&Math.abs(y-previousY)>3){rows.push(line.trim());line=''}
         line+=item.str+' ';previousY=y;
         if(item.hasEOL){rows.push(line.trim());line=''}
       }
       if(line.trim())rows.push(line.trim());
       pages.push(rows.join('\n'));
     }
     return pages.join('\n').slice(0,60000);
   }finally{await doc.destroy()}
 }
 if(ext==='docx'){
   const lib=await import('https://esm.sh/mammoth@1.9.1/mammoth.browser.js');
   const result=await (lib.default||lib).extractRawText({arrayBuffer:await file.arrayBuffer()});
   return result.value.slice(0,60000);
 }
 throw Error('Choose a PDF, DOCX or TXT file.');
}
function parseCv(raw){
 const out={jobs:[],study:[],projects:[]},groups={contact:[],summary:[],jobs:[],study:[],skills:[],projects:[],languages:[],unmapped:[]};
 const patterns={summary:/^(professional |career |executive |personal )?(summary|objective|profile|about me)$/,jobs:/^(professional |work |relevant )?(experience|employment( history)?|work history)$/,study:/^(education( and (training|certifications))?|academic qualifications|certifications|qualifications|training)$/,skills:/^(technical |core |key |professional )?(skills|competencies|expertise)$/,projects:/^(selected |key )?(projects|achievements|accomplishments)( and accomplishments)?$/,languages:/^language(s| skills)?$/};
 let section='contact';
 for(const line of raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)){
   const heading=line.toLowerCase().replace(/\s*:\s*$/,'');
   const key=Object.keys(patterns).find(k=>patterns[k].test(heading));
   if(key){section=key;continue}
   if(/^(references|interests|hobbies|additional information|personal details)$/.test(heading)){section='unmapped';groups.unmapped.push(line);continue}
   if(!/^(curriculum vitae|resume|résumé|cv)$/i.test(line))groups[section].push(line);
 }
 const contact=groups.contact.join('\n');
 out.email=(contact.match(/[\w.%+-]+@[\w.-]+\.[a-z]{2,}/i)?.[0]||raw.match(/[\w.%+-]+@[\w.-]+\.[a-z]{2,}/i)?.[0]||'');
 out.phone=contact.match(/(?:\+\d|\(\d|\b0)\d?[\d ().-]{6,18}\d/)?.[0]?.trim()||'';
 out.link=contact.match(/(?:https?:\/\/|www\.|linkedin\.com\/in\/)[^\s|,]+/i)?.[0]||'';
 const names=groups.contact.filter(x=>!/[\d@|:/]/.test(x)&&x.length<70);
 out.name=names[0]||'';
 out.summary=groups.summary.join('\n');out.skills=groups.skills.join('\n');out.languages=groups.languages.join(', ');
 for(const key of ['jobs','study','projects']){
   const rows=groups[key];
   let entry;
   for(const line of rows){
     const date=line.match(/(?:19|20)\d{2}\s*(?:[-–—]|to)\s*(?:(?:19|20)\d{2}|present|current)/i);
     const bullet=/^[•●▪*–-]\s*/.test(line);
     const split=line.split(/\s+[|—–]\s+/);
     if(!entry||(!bullet&&(split.length>1&&!date))){
       entry={title:split[0],company:split.slice(1).join(' — ')};out[key].push(entry);
       continue;
     }
     if(date&&!entry.dates&&line.length<65){entry.dates=line;continue}
     if(key==='study'&&!entry.company&&!bullet){entry.company=line;continue}
     entry.detail=[entry.detail,line.replace(/^[•●▪*–-]\s*/, '')].filter(Boolean).join('\n');
   }
 }
 out.unmapped=[...groups.contact.filter(x=>x!==out.name && ![out.email,out.phone,out.link].some(v=>v&&x===v)),...groups.unmapped].join('\n');
 return out;
}
function reviewPanel(){
 const list=elem('ul');list.className='review-list';
 const checks=[
   [d.name?.trim()&&d.email?.trim(),'Name and contact email'],
   [d.summary?.trim(),'Professional summary'],
   [d.jobs.some(j=>j.title&&j.dates),'Experience with dates'],
   [d.jobs.some(j=>/\d/.test(j.detail||'')),'Measurable achievement'],
   [d.skills?.trim(),'Relevant skills']
 ];
 for(const [ok,label] of checks)list.append(elem('li',(ok?'✓ ':'Review: ')+label));
 form.append(elem('h2','Before you export'),list);
 if(d.posting?.trim()){
   const terms=text=>new Set(text.toLowerCase().match(/[a-z][a-z-]{3,}/g)||[]);
   const cv=terms(lines().filter(l=>l.type!=='role').map(l=>l.text).join(' '));
   const ignored=new Set('with that this will your from have are and the their about which must should team work role including looking other experience ability skills'.split(' '));
   const missing=[...terms(d.posting)].filter(t=>!ignored.has(t)&&!cv.has(t)).slice(0,12);
   form.append(elem('p',missing.length?'Job posting terms to review: '+missing.join(', ')+'. Add terms only where they reflect your experience.':'The CV includes the terms checked from this job posting.'));
 }
}
function lines(){let a=[];function add(type,text){if(text?.trim())a.push({type,text:text.trim()})}add('name',d.name);add('role',d.role);add('text',[d.email,d.phone,d.location,d.link,d.region===regions[4]?d.permit:''].filter(Boolean).join(' | '));function group(name,fn){let i=a.length;fn();if(a.length>i)a.splice(i,0,{type:'heading',text:name})}group(d.region===regions[3]?'Personal profile':'Professional summary',()=>add('text',d.summary));function list(key,heading){group(heading,()=>d[key].forEach(o=>{add('bold',[o.title,o.company].filter(Boolean).join(' — '));add('text',o.dates);(o.detail||'').split('\n').filter(s=>s.trim()).forEach(s=>add('text','• '+s.trim().replace(/^[•-]\s*/,'')))}))}list('jobs','Work experience');list('study',d.region===regions[2]?'Education and training':'Education and certifications');group('Skills',()=>add('text',d.skills));if(d.languages)group('Language skills',()=>add('text',d.languages));list('projects','Projects and accomplishments');return a}
function preview(){let p=$('paper');p.className=d.template;p.replaceChildren();let a=lines();if(!a.length)p.append(elem('p','Your CV will appear here as you enter your details.'));for(let l of a)p.append(elem(({name:'h2',heading:'h3',bold:'strong',role:'h4'})[l.type]||'p',l.text))}
function pdf(){if(!d.name?.trim()){step=1;render();return say('Add your name before downloading.')}if(!window.pdfMake)return say('PDF tools could not load. Refresh and try again.');let editorial=d.template==='Editorial',executive=d.template==='Executive';pdfMake.createPdf({pageSize:d.region===regions[1]?'LETTER':'A4',pageMargins:editorial?[55,45,55,45]:[42,40,42,40],defaultStyle:{fontSize:10,lineHeight:1.18},content:lines().map(({type,text})=>({text:executive&&type==='heading'?text.toUpperCase():text,bold:['name','heading','bold','role'].includes(type),italics:editorial&&type==='role',fontSize:type==='name'?(editorial?27:23):type==='heading'?14:10,color:executive&&type==='heading'?'#305477':'#16262a',margin:[0,type==='heading'?12:type==='bold'?5:1,0,2],headlineLevel:type==='heading'?1:undefined})),pageBreakBefore:(node,following)=>node.headlineLevel===1&&!following.length}).download((d.name||'Candidate')+' CV.pdf')}
function say(s){$('status').textContent=s}
$('back').onclick=()=>{if(step)step--;say('');render()};$('next').onclick=()=>{say('');if(step===7)return pdf();step++;visited=Math.max(visited,step);render()};
async function workspace(save){let {data,error}=await db.rpc('cv_workspace',save?{save_draft:d}:{});if(error)throw error;return data}
async function enter(u){if(!u)return;let result=await workspace(false);user=u;$('account').textContent='Sign out';if(Object.keys(result.draft).length){if(!lines().length||confirm('Load your saved CV and replace the current draft?'))d={...initial(),...result.draft}}render();say('Workspace access through '+new Date(result.expires).toLocaleDateString())}
$('save').onclick=async()=>{if(!user)return $('login').showModal();try{await workspace(true);say('CV saved.')}catch(e){say(e.message)}};
$('account').onclick=async()=>{if(!user)return $('login').showModal();if(!confirm('Sign out and clear the draft on this screen?'))return;const {error}=await db.auth.signOut({scope:'local'});if(error)return say(error.message);location.reload()};
$('closeLogin').onclick=()=>$('login').close();$('auth').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{if(!db)throw Error('Account service could not load.');let credentials={email:$('email').value,password:$('password').value};let {data,error}=e.submitter.value==='up'?await db.auth.signUp({...credentials,options:{emailRedirectTo:location.href.split('#')[0]}}):await db.auth.signInWithPassword(credentials);if(error)throw error;if(!data.session){$('message').textContent='Check your email to confirm, then sign in here.';return}await enter(data.user);$('password').value='';$('login').close()}catch(err){$('message').textContent=err.message}finally{busy=false}};
render();if(db){try{let {data}=await db.auth.getSession();await enter(data.session?.user)}catch(e){say(e.message)}}
</script></html>
