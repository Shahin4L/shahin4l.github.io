async function extractText(file){
 if(file.size>10*1024*1024)throw Error('This file exceeds 10 MB.');
 const ext=file.name.split('.').pop().toLowerCase();
 if(ext==='txt')return (await file.text()).slice(0,60000);
 if(ext==='pdf'){
   const base='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/';
   const pdf=await import(base+'pdf.min.mjs');
   pdf.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.mjs';
   const doc=await pdf.getDocument({data:await file.arrayBuffer(),isEvalSupported:false}).promise;
   try{
     if(doc.numPages>30)throw Error('Import supports PDFs of up to 30 pages.');
     const pages=[];
     for(let i=1;i<=doc.numPages;i++){
       const page=await doc.getPage(i),content=await page.getTextContent();
       let previousY,line='',rows=[];
       for(const item of content.items){
         if(!('str' in item))continue;
         const y=item.transform[5];
         if(line&&Math.abs(y-previousY)>3){rows.push(line.trim());line=''}
         line+=item.str+' ';previousY=y;
         if(item.hasEOL){rows.push(line.trim());line=''}
       }
       if(line.trim())rows.push(line.trim());
       pages.push(rows.join('\n'));
     }
     return pages.join('\n').slice(0,60000);
   }finally{await doc.destroy()}
 }
 if(ext==='docx'){
   const lib=await import('https://esm.sh/mammoth@1.9.1/mammoth.browser.js');
   const result=await (lib.default||lib).extractRawText({arrayBuffer:await file.arrayBuffer()});
   return result.value.slice(0,60000);
 }
 throw Error('Choose a PDF, DOCX or TXT file.');
}
function parseCv(raw){
 const out={jobs:[],study:[],projects:[]},groups={contact:[],summary:[],jobs:[],study:[],skills:[],projects:[],languages:[],unmapped:[]};
 const patterns={summary:/^(professional |career |executive |personal )?(summary|objective|profile|about me)$/,jobs:/^(professional |work |relevant )?(experience|employment( history)?|work history)$/,study:/^(education( and (training|certifications))?|academic qualifications|certifications|qualifications|training)$/,skills:/^(technical |core |key |professional )?(skills|competencies|expertise)$/,projects:/^(selected |key )?(projects|achievements|accomplishments)( and accomplishments)?$/,languages:/^language(s| skills)?$/};
 let section='contact';
 for(const line of raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)){
   const heading=line.toLowerCase().replace(/\s*:\s*$/,'');
   const key=Object.keys(patterns).find(k=>patterns[k].test(heading));
   if(key){section=key;continue}
   if(/^(references|interests|hobbies|additional information|personal details)$/.test(heading)){section='unmapped';groups.unmapped.push(line);continue}
   if(!/^(curriculum vitae|resume|résumé|cv)$/i.test(line))groups[section].push(line);
 }
 const contact=groups.contact.join('\n');
 out.email=(contact.match(/[\w.%+-]+@[\w.-]+\.[a-z]{2,}/i)?.[0]||raw.match(/[\w.%+-]+@[\w.-]+\.[a-z]{2,}/i)?.[0]||'');
 out.phone=contact.match(/(?:\+\d|\(\d|\b0)\d?[\d ().-]{6,18}\d/)?.[0]?.trim()||'';
 out.link=contact.match(/(?:https?:\/\/|www\.|linkedin\.com\/in\/)[^\s|,]+/i)?.[0]||'';
 const names=groups.contact.filter(x=>!/[\d@|:/]/.test(x)&&x.length<70);
 out.name=names[0]||'';
 out.summary=groups.summary.join('\n');out.skills=groups.skills.join('\n');out.languages=groups.languages.join(', ');
 for(const key of ['jobs','study','projects']){
   const rows=groups[key];
   let entry;
   for(const line of rows){
     const date=line.match(/(?:19|20)\d{2}\s*(?:[-–—]|to)\s*(?:(?:19|20)\d{2}|present|current)/i);
     const bullet=/^[•●▪*–-]\s*/.test(line);
     const split=line.split(/\s+[|—–]\s+/);
     if(!entry||(!bullet&&(split.length>1&&!date))){
       entry={title:split[0],company:split.slice(1).join(' — ')};out[key].push(entry);
       continue;
     }
     if(date&&!entry.dates&&line.length<65){entry.dates=line;continue}
     if(key==='study'&&!entry.company&&!bullet){entry.company=line;continue}
     entry.detail=[entry.detail,line.replace(/^[•●▪*–-]\s*/, '')].filter(Boolean).join('\n');
   }
 }
 out.unmapped=[...groups.contact.filter(x=>x!==out.name && ![out.email,out.phone,out.link].some(v=>v&&x===v)),...groups.unmapped].join('\n');
 return out;
}

function atsAssessment(raw,posting){
 const cv=parseCv(raw);
 const words=raw.match(/[\p{L}\p{N}]+/gu)||[];
 const date=/\b(?:19|20)\d{2}\b/;
 const hits=[
   [15,words.length>=60,'Readable content','Use selectable text and include enough detail for the role. If the PDF is scanned, export a searchable copy.'],
   [15,Boolean(cv.email&&cv.name),'Contact details','Add your name and a working email address as plain text at the top.'],
   [20,cv.jobs.some(j=>j.title&&((j.detail||'').length>=20||j.company)),'Work experience','Use a Work Experience heading and give each role a job title, employer and achievement bullets.'],
   [10,date.test(raw),'Employment or education dates','List dates consistently, for example Jan 2022 – Mar 2025.'],
   [15,Boolean(cv.skills),'Skills section','Add a Skills heading and list the tools, methods and role-specific skills you can demonstrate.'],
   [10,cv.study.some(j=>j.title),'Education or certifications','Add an Education or Certifications heading with the qualification and institution.'],
   [15,cv.jobs.some(j=>/\b\d+[.,]?\d*\s*(?:%|[a-z]{2,})/i.test(j.detail||'')),'Evidence of impact','Where accurate, quantify results using volumes, savings, quality measures or team size.']
 ];
 const ignored=new Set('about after also and are before being benefits candidate company could description each employment excellent for from good have hiring including looking more most must our people relevant required requirements role should strong that the their them these this those through use using want were when where which will with within would years you your'.split(' '));
 const tokens=t=>t.toLowerCase().match(/[a-z][a-z0-9+#.-]{2,}/g)?.map(w=>w.replace(/[.-]+$/,''))||[];
 const counts=new Map();
 for(const term of tokens(posting))if(term.length>=3&&!ignored.has(term))counts.set(term,(counts.get(term)||0)+1);
 const keywords=[...counts].sort((a,b)=>b[1]-a[1]).slice(0,24).map(([word])=>word);
 const present=new Set(tokens(raw)),missing=keywords.filter(w=>!present.has(w));
 return {hits,score:hits.reduce((sum,[weight,pass])=>sum+(pass?weight:0),0),keywords,missing};
}

$('atsFile').onchange=async()=>{

 catch(e){atsStatus.textContent=e.message}

$('runAts').onclick=async()=>{
 atsResults.replaceChildren();atsStatus.textContent='';
 if(!atsText.value.trim()){atsStatus.textContent='Upload a CV or paste its text first.';return}

 run.disabled=true;run.textContent='Checking…';atsStatus.textContent='Checking CV text, structure and job terms…';
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 try{
 const result=atsAssessment(atsText.value.slice(0,60000),$('atsPosting').value.slice(0,30000));
 const card=elem('div');card.className='ats-score';
 card.append(elem('strong',result.score+'% estimated ATS readiness'),elem('p','This checklist measures text and content signals. Employer ATS settings and hiring decisions vary.'));
 if(result.keywords.length)card.append(elem('p',Math.round(100*(result.keywords.length-result.missing.length)/result.keywords.length)+'% job keyword match across '+result.keywords.length+' terms.'));
 atsResults.append(card);
 if(atsFromDraft&&d.template==='Portrait')atsResults.append(elem('p','For an ATS application, switch the CV template to Classic, Editorial or Executive to exclude the photo.'));
 const fixes=result.hits.filter(hit=>!hit[1]).sort((a,b)=>b[0]-a[0]);
 const examples={
   'Readable content':'Export the CV from your original document as a text-based PDF. Open it and try selecting and copying a sentence.',
   'Contact details':'[Full name] · [City, country] · [Professional email]',
   'Work experience':'[Job title] | [Employer] · [Dates]. Add a bullet explaining what you did, how you did it and the result.',
   'Employment or education dates':'Mar 2022 – Present. Include the month when you know it.',
   'Skills section':'For a logistics role, list skills you actually use, such as inventory reconciliation, dispatch planning or Excel reporting.',
   'Education or certifications':'[Qualification] | [Institution or issuer] · [Year]',
   'Evidence of impact':'Reduced [metric] from [baseline] to [result] by [action] over [period]. Use figures you can verify.'
 };
 const items=elem('div');items.className='ats-fixes';
 atsResults.append(elem('h3',fixes.length?'Improvements to make first':'All checklist items met'),items);
 for(const [points,,label,fix] of fixes){
   const item=elem('div');item.className='ats-fix';
   const example=elem('p',examples[label]);example.className='ats-example';
   item.append(elem('strong',label+' · '+points+' points available'),elem('p',fix),example);items.append(item);
 }
 const passed=result.hits.filter(hit=>hit[1]).map(hit=>hit[2]);
 if(passed.length){const summary=elem('p','✓ Checks met: '+passed.join(' · '));summary.className='ats-good';atsResults.append(summary)}
 if(result.missing.length){
   const tags=elem('div');tags.className='ats-keywords';
   result.missing.forEach(word=>tags.append(elem('span',word)));
   atsResults.append(elem('h3','Job terms to review'),elem('p','If a term matches your experience, use it in the skills section or in a bullet that shows how you applied it.'),tags);
 }
 atsStatus.textContent='Check complete. '+fixes.length+' checklist improvement'+(fixes.length===1?'':'s')+' found.';
 }catch{atsStatus.textContent='The CV check could not finish. Check the extracted text and try again.'}
 finally{run.disabled=false;run.textContent='Check CV'}

};
function reviewPanel(){
 const list=elem('ul');list.className='review-list';
 const checks=[
   [d.name?.trim()&&d.email?.trim(),'Name and contact email'],
   [d.summary?.trim(),'Professional summary'],
   [d.jobs.some(j=>j.title&&j.dates),'Experience with dates'],
   [d.jobs.some(j=>/\d/.test(j.detail||'')),'Measurable achievement'],
   [d.skills?.trim(),'Relevant skills']
 ];
 for(const [ok,label] of checks)list.append(elem('li',(ok?'✓ ':'Review: ')+label));
 form.append(elem('h2','Before you export'),list);
 if(d.posting?.trim()){
   const terms=text=>new Set(text.toLowerCase().match(/[a-z][a-z-]{3,}/g)||[]);
   const cv=terms(lines().filter(l=>l.type!=='role').map(l=>l.text).join(' '));
   const ignored=new Set('with that this will your from have are and the their about which must should team work role including looking other experience ability skills'.split(' '));
   const missing=[...terms(d.posting)].filter(t=>!ignored.has(t)&&!cv.has(t)).slice(0,12);
   form.append(elem('p',missing.length?'Job posting terms to review: '+missing.join(', ')+'. Add terms only where they reflect your experience.':'The CV includes the terms checked from this job posting.'));
 }
}
function lines(){let a=[];function add(type,text){if(text?.trim())a.push({type,text:text.trim()})}add('name',d.name);add('role',d.role);add('text',[d.email,d.phone,d.location,d.link,d.region===regions[4]?d.permit:''].filter(Boolean).join(' | '));function group(name,fn){let i=a.length;fn();if(a.length>i)a.splice(i,0,{type:'heading',text:name})}group(d.region===regions[3]?'Personal profile':'Professional summary',()=>add('text',d.summary));function list(key,heading){group(heading,()=>d[key].forEach(o=>{add('bold',[o.title,o.company].filter(Boolean).join(' — '));add('text',o.dates);(o.detail||'').split('\n').filter(s=>s.trim()).forEach(s=>add('text','• '+s.trim().replace(/^[•-]\s*/,'')))}))}list('jobs','Work experience');list('study',d.region===regions[2]?'Education and training':'Education and certifications');group('Skills',()=>add('text',d.skills));if(d.languages)group('Language skills',()=>add('text',d.languages));list('projects','Projects and accomplishments');return a}
function preview(){let p=$('paper');p.className=d.template;p.replaceChildren();if(d.template==='Portrait'&&photo()){const img=elem('img');img.src=photo();img.alt='Profile photo';img.className='cv-photo';p.append(img)}let a=lines();if(!a.length)p.append(elem('p','Your CV will appear here as you enter your details.'));for(let l of a)p.append(elem(({name:'h2',heading:'h3',bold:'strong',role:'h4'})[l.type]||'p',l.text))}
function pdf(){if(!d.name?.trim()){step=1;render();return say('Add your name before downloading.')}if(!window.pdfMake)return say('PDF tools could not load. Refresh and try again.');let editorial=d.template==='Editorial',executive=d.template==='Executive';const content=lines().map(({type,text})=>({text:executive&&type==='heading'?text.toUpperCase():text,bold:['name','heading','bold','role'].includes(type),italics:editorial&&type==='role',fontSize:type==='name'?(editorial?27:23):type==='heading'?14:10,color:(executive||d.template==='Portrait')&&type==='heading'?'#305477':'#16262a',margin:[0,type==='heading'?12:type==='bold'?5:1,0,2],headlineLevel:type==='heading'?1:undefined}));
if(d.template==='Portrait'&&photo()){
 const firstHeading=content.findIndex(node=>node.headlineLevel===1);
 const header=content.splice(0,firstHeading<0?content.length:firstHeading);
 content.unshift({columns:[{stack:header,width:'*'},{image:photo(),width:70}],columnGap:16,margin:[0,0,0,8]});
}
pdfMake.createPdf({pageSize:d.region===regions[1]?'LETTER':'A4',pageMargins:editorial?[55,45,55,45]:[42,40,42,40],defaultStyle:{fontSize:10,lineHeight:1.18},content,pageBreakBefore:(node,following)=>node.headlineLevel===1&&!following.length}).download((d.name||'Candidate')+' CV.pdf')}
function say(s){$('status').textContent=s}
$('back').onclick=()=>{if(step)step--;say('');render()};$('next').onclick=()=>{say('');if(step===7)return pdf();step++;visited=Math.max(visited,step);render()};
async function workspace(save){let {data,error}=await db.rpc('cv_workspace',save?{save_draft:d}:{});if(error)throw error;return data}
async function enter(u){if(!u)return;let result=await workspace(false);user=u;$('account').textContent='Sign out';if(!d.name&&!Object.keys(result.draft).length)d.name=u.user_metadata?.full_name||'';if(Object.keys(result.draft).length){if(!lines().length||confirm('Load your saved CV and replace the current draft?'))d={...initial(),...result.draft}}render();say('Workspace access through '+new Date(result.expires).toLocaleDateString())}
const login=$('login'), authForm=$('auth'), authSubmit=$('authSubmit');
const callbackUrl=location.origin+location.pathname;
let mode='email';
let verificationEmail='';
const modes={
 email:['Continue with email','Enter your email to sign in or create an account.','Send verification email','Sending…'],
 verify:['Check your email','Paste the code from the latest email. If it contains a sign-in button, you can open that link instead.','Verify and continue','Verifying…'],
 in:['Sign in with a password','Use the password for your existing account.','Sign in','Signing in…'],
 forgot:['Reset your password','Enter your account email to request a password reset link.','Send reset link','Requesting reset link…'],
 reset:['Set a new password','Choose a new password with at least eight characters.','Update password','Updating password…']
};
function authMessage(text,error=false){
 $('message').textContent=text;$('message').toggleAttribute('data-error',error);
}
function showMode(next){
 mode=next;
 if(mode!=='verify')verificationEmail='';
 const [title,help,label]=modes[mode];
 $('accountTitle').textContent=title;$('accountHelp').textContent=help;authSubmit.textContent=label;
 const needsPassword=['in','reset'].includes(mode), needsEmail=mode!=='reset';
 const email=$('email'),password=$('password'),otp=$('otp');
 email.readOnly=mode==='verify';
 if(email.readOnly)email.value=verificationEmail;

 $('otpLabel').hidden=mode!=='verify';otp.required=mode==='verify';otp.disabled=mode!=='verify';otp.value='';
 $('emailLabel').hidden=!needsEmail;email.required=needsEmail;email.disabled=!needsEmail;
 $('passwordLabel').hidden=!needsPassword;password.required=needsPassword;password.disabled=!needsPassword;
 password.minLength=mode==='in'?0:8;password.autocomplete=mode==='in'?'current-password':'new-password';password.value='';
 const links=$('authLinks');links.replaceChildren();
 if(mode==='email')button(links,'Use a password',()=>{showMode('in');authMessage('')});
 if(mode==='in')button(links,'Forgot password?',()=>{showMode('forgot');authMessage('')});
 if(mode==='verify')button(links,'Resend email',()=>requestCode(verificationEmail));
 if(mode!=='email'&&mode!=='reset')button(links,mode==='verify'?'Change email':'Continue with email',()=>{showMode('email');authMessage('');email.focus()});
}
function openAccount(next='email'){
 showMode(next);authMessage('');if(!login.open)login.showModal();
}
function authError(error){
 switch(error.code){
 case 'email_not_confirmed':showMode('email');return 'Verify this email to continue. Select Send verification email.';
 case 'unexpected_failure':if(['email','verify','forgot'].includes(mode))return 'The email service could not complete this request. If you already have a verified account, you can use your password.';break;
 case 'invalid_credentials':return 'That email and password did not match. Check both fields or reset your password.';
 case 'email_address_not_authorized':return 'The site’s email service cannot send to this address. Contact the site owner to enable public account emails.';
 case 'over_email_send_rate_limit':return 'The email service is rate-limited. Wait before requesting another link.';
 case 'otp_expired':return 'This code or link is invalid or expired. Request a new email and use the latest code or link.';
 }
 return error.message||'The account request failed. Please try again.';
}
$('save').onclick=async()=>{
 if(!user)return openAccount();
 const save=$('save');save.disabled=true;save.textContent='Saving…';
 try{await workspace(true);say('CV saved.')}catch(e){say(e.message)}
 finally{save.disabled=false;save.textContent='Save CV'}
};
$('account').onclick=async()=>{
 if(!user)return openAccount();
 if(!confirm('Sign out and clear the draft on this screen?'))return;
 const account=$('account');account.disabled=true;account.textContent='Signing out…';
 try{const {error}=await db.auth.signOut({scope:'local'});if(error)throw error;location.reload()}
 catch(e){say(e.message);account.textContent='Sign out';account.disabled=false}
};
login.addEventListener('cancel',e=>{if(busy)e.preventDefault()});
async function authAction(label,action){
 if(busy)return;
 busy=true;authForm.setAttribute('aria-busy','true');authSubmit.disabled=true;$('closeLogin').disabled=true;$('authLinks').inert=true;
 authSubmit.textContent=label;authMessage(label);
 try{
   if(!db)throw Error('The account service did not load. Refresh and try again.');
   await action();
 }catch(err){authMessage(authError(err),true)}
 finally{
   busy=false;authForm.removeAttribute('aria-busy');authSubmit.disabled=false;$('closeLogin').disabled=false;$('authLinks').inert=false;
   authSubmit.textContent=modes[mode][2];
 }
}
function requestCode(email){
 return authAction('Sending…',async()=>{
   const {error}=await db.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:callbackUrl}});
   if(error)throw error;
   verificationEmail=email;showMode('verify');
   authMessage('Request accepted. Check your inbox or spam folder.');$('otp').focus();
 });
}
authForm.onsubmit=e=>{
 e.preventDefault();
 const email=mode==='verify'?verificationEmail:$('email').value.trim();
 if(mode==='email')return requestCode(email);
 return authAction(modes[mode][3],async()=>{
   const password=$('password').value;
   if(mode==='forgot'){
     const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:callbackUrl});
     if(error)throw error;
     authMessage('If an account exists for this address, check your inbox for the reset link.');return;
   }
   const {data,error}=mode==='verify'
     ?await db.auth.verifyOtp({email,token:$('otp').value.trim(),type:'email'})
     :mode==='reset'?await db.auth.updateUser({password}):await db.auth.signInWithPassword({email,password});
   if(error)throw error;
   if(!data.user)throw Error('Sign-in did not complete. Please try again.');
   await enter(data.user);$('password').value='';login.close();
 });
};

render();
if(db){
 try{
   const {data,error}=await db.auth.getSession();
   if(error)throw error;
   if(recoveryLink&&data.session)openAccount('reset');
   else if(authCallback.has('error')){openAccount();authMessage('This email link could not be used. Request a new link and try again.',true);history.replaceState(null,'',callbackUrl)}
   else await enter(data.session?.user);
 }catch(e){say(e.message)}
}
</script></html>
