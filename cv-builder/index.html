<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CV Studio | Shahin Alam</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f3;color:#172e31;font:16px/1.5 "Segoe UI",sans-serif}header,main{max-width:1250px;margin:auto;padding:20px}header,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between;border-bottom:1px solid #c9d4ce}a{color:#235f57}h1{font:normal clamp(34px,5vw,58px)/1.1 Georgia;margin:20px 0}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px}section,aside,dialog{background:white;padding:clamp(18px,3vw,34px);border:1px solid #d4ddd7;border-radius:12px}aside{align-self:start}label{display:block;font-weight:600;margin:16px 0 4px}input,textarea,select{width:100%;padding:10px;border:1px solid #96aaa1;border-radius:5px;font:inherit}textarea{min-height:100px}button{border:1px solid #b5c8bf;background:#fff;color:#183f38;padding:9px 14px;border-radius:6px;font:inherit;cursor:pointer}button.primary{background:#19594d;color:white}button:disabled{opacity:.5}small,output{display:block;color:#45615a}output{padding:8px 0;white-space:pre-wrap}article{overflow-wrap:anywhere}article p{white-space:pre-line;margin:5px 0}article h3{border-bottom:1px solid;margin:20px 0 5px}article h2{margin-bottom:0}.Editorial{font-family:Georgia,serif}.Executive h3{text-transform:uppercase;color:#305477}dialog{max-width:400px;width:90%}.actions{margin-top:16px}fieldset{padding:14px;margin:14px 0;border:1px solid #d1dcd6}progress{width:100%;accent-color:#19594d}@media(max-width:800px){main{grid-template-columns:1fr}} 
</style>
<header><a href="/">← Portfolio</a><strong>CV Studio</strong><button id="account">Sign in</button></header>
<main><section><small id="count"></small><progress id="progress" max="8"></progress><h1 id="heading"></h1><form id="form"></form><div class="actions"><button id="back">Back</button><button class="primary" id="next">Continue</button><button id="save">Save CV</button></div><output id="status" role="status"></output></section><aside><small>LIVE PREVIEW</small><article id="paper"></article></aside></main>
<dialog id="login"><h2>Your CV workspace</h2><p>Access lasts two calendar months from first use. Saved CV data is erased after three months.</p><form id="auth"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="6" autocomplete="current-password"></label><div class="actions"><button class="primary" value="in">Sign in</button><button value="up">Create account</button></div></form><output id="message"></output><button id="closeLogin">Close</button></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.12/build/pdfmake.min.js"></script><script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.12/build/vfs_fonts.js"></script>
<script type="module">
const $=id=>document.getElementById(id);
const db=window.supabase?.createClient('https://gckaucdwkyhmctfnimbb.supabase.co','sb_publishable_gm2VHpWs9jnyo5CSJ6P1WA_jpBLwoM0',{auth:{storageKey:'cv-studio-session',detectSessionInUrl:true}});
const regions=['Bangladesh / South Asia','USA / Canada','Europe','UK','UAE / GCC'],templates=['Classic','Editorial','Executive'];
const titles=['Target role','Contact details','Professional summary','Work experience','Education and certifications','Skills','Projects and accomplishments','Review and download'];
const initial=()=>({region:regions[0],template:templates[0],jobs:[{}],study:[{}],projects:[{}]});
let d=initial(),step=0,user,engine,busy=false;
const elem=(tag,txt)=>{const n=document.createElement(tag);if(txt)n.textContent=txt;return n};
function field(parent,obj,key,label,kind='input',options=[]){const l=elem('label',label),n=elem(kind);if(kind==='select')options.forEach(v=>n.add(new Option(v,v)));n.value=obj[key]||'';n.oninput=()=>{obj[key]=n.value;preview()};l.append(n);parent.append(l);return n}
function button(parent,label,fn){let b=elem('button',label);b.type='button';b.onclick=fn;parent.append(b);return b}
function entries(key,title,fields){d[key].forEach((o,i)=>{let box=elem('fieldset');box.append(elem('legend',title+' '+(i+1)));fields.forEach(([k,l,t])=>field(box,o,k,l,t));if(key!=='study')ai(box,o,'detail');button(box,'Remove',()=>{d[key].splice(i,1);render()});form.append(box)});button(form,'Add '+title.toLowerCase(),()=>{d[key].push({});render()})}
function ai(box,o,k){let b=button(box,'Suggest AI revision',async()=>{if(!o[k]?.trim())return say('Enter a draft first.');if(!navigator.gpu)return say('AI revision needs a WebGPU-enabled browser.');b.disabled=true;try{say('Loading the on-device language model. The first use requires a model download.');const lib=await import('https://esm.run/@mlc-ai/web-llm@0.2.79');const model=lib.prebuiltAppConfig.model_list.find(m=>/^Qwen2.5-0.5B-Instruct-q4f(32|16)_1/.test(m.model_id))||lib.prebuiltAppConfig.model_list.find(m=>/^Llama-3.2-1B-Instruct-q4/.test(m.model_id));engine??=await lib.CreateMLCEngine(model.model_id,{initProgressCallback:p=>say(p.text)});const r=await engine.chat.completions.create({messages:[{role:'system',content:'Edit the provided CV text for clarity and relevant professional terminology. Use action verbs. Preserve facts. Never invent metrics, skills or achievements. Return only revised text.'},{role:'user',content:'Target role: '+(d.role||'')+'\nText: '+o[k]}],max_tokens:400,temperature:.2});let s=r.choices[0].message.content.trim();const suggestion=elem('fieldset');suggestion.append(elem('legend','Review suggestion'),elem('p',s));button(suggestion,'Use revision',()=>{o[k]=s;render()});button(suggestion,'Dismiss',()=>suggestion.remove());box.append(suggestion);say('')}catch{say('AI could not load. Check browser GPU support, memory and network access.')}finally{b.disabled=false}})}
const form=$('form');form.onsubmit=e=>e.preventDefault();
function render(){form.replaceChildren();$('heading').textContent=titles[step];$('count').textContent='STEP '+(step+1)+' OF 8';$('progress').value=step+1;$('back').disabled=!step;$('next').textContent=step===7?'Download PDF':'Continue';
switch(step){case 0:field(form,d,'role','Which role are you applying for?');field(form,d,'region','Target market','select',regions);break;
case 1:for(const [k,l] of [['name','Full name'],['email','Contact email'],['phone','Phone with country code'],['location','City and country'],['link','Professional profile or portfolio']])field(form,d,k,l);if(d.region===regions[4])field(form,d,'permit','Work authorization (optional)');break;
case 2:field(form,d,'summary','What experience and strengths would you bring to this role?','textarea');ai(form,d,'summary');break;
case 3:entries('jobs','Position',[['title','Job title'],['company','Employer'],['dates','Dates (month and year)'],['detail','Achievements, one per line','textarea']]);break;
case 4:entries('study','Qualification',[['title','Degree or certification'],['company','Institution or issuer'],['dates','Dates']]);break;
case 5:field(form,d,'skills','Technical and interpersonal skills','textarea');if(d.region===regions[2])field(form,d,'languages','Languages and proficiency');break;
case 6:entries('projects','Project',[['title','Project or accomplishment'],['detail','Contribution and outcome','textarea']]);break;
case 7:field(form,d,'template','Choose a template','select',templates);form.append(elem('p','Check your contact details, dates and achievements in the preview before downloading.'));break}preview()}
function lines(){let a=[];function add(type,text){if(text?.trim())a.push({type,text:text.trim()})}add('name',d.name);add('role',d.role);add('text',[d.email,d.phone,d.location,d.link,d.region===regions[4]?d.permit:''].filter(Boolean).join(' | '));function group(name,fn){let i=a.length;fn();if(a.length>i)a.splice(i,0,{type:'heading',text:name})}group(d.region===regions[3]?'Personal profile':'Professional summary',()=>add('text',d.summary));function list(key,heading){group(heading,()=>d[key].forEach(o=>{add('bold',[o.title,o.company].filter(Boolean).join(' — '));add('text',o.dates);(o.detail||'').split('\n').filter(s=>s.trim()).forEach(s=>add('text','• '+s.trim().replace(/^[•-]\s*/,'')))}))}list('jobs','Work experience');list('study',d.region===regions[2]?'Education and training':'Education and certifications');group('Skills',()=>add('text',d.skills));if(d.region===regions[2])group('Language skills',()=>add('text',d.languages));list('projects','Projects and accomplishments');return a}
function preview(){let p=$('paper');p.className=d.template;p.replaceChildren();let a=lines();if(!a.length)p.append(elem('p','Your CV will appear here as you enter your details.'));for(let l of a)p.append(elem(({name:'h2',heading:'h3',bold:'strong',role:'h4'})[l.type]||'p',l.text))}
function pdf(){if(!d.name?.trim()){step=1;render();return say('Add your name before downloading.')}if(!window.pdfMake)return say('PDF tools could not load. Refresh and try again.');let editorial=d.template==='Editorial',executive=d.template==='Executive';pdfMake.createPdf({pageSize:d.region===regions[1]?'LETTER':'A4',pageMargins:editorial?[55,45,55,45]:[42,40,42,40],defaultStyle:{fontSize:10,lineHeight:1.18},content:lines().map(({type,text})=>({text:executive&&type==='heading'?text.toUpperCase():text,bold:['name','heading','bold','role'].includes(type),italics:editorial&&type==='role',fontSize:type==='name'?(editorial?27:23):type==='heading'?14:10,color:executive&&type==='heading'?'#305477':'#16262a',margin:[0,type==='heading'?12:type==='bold'?5:1,0,2]}))}).download((d.name||'Candidate')+' CV.pdf')}
function say(s){$('status').textContent=s}
$('back').onclick=()=>{if(step)step--;say('');render()};$('next').onclick=()=>{say('');if(step===7)return pdf();step++;render()};
async function workspace(save){let {data,error}=await db.rpc('cv_workspace',save?{save_draft:d}:{});if(error)throw error;return data}
async function enter(u){if(!u)return;let result=await workspace(false);user=u;$('account').textContent='Sign out';if(Object.keys(result.draft).length){if(!lines().length||confirm('Load your saved CV and replace the current draft?'))d={...initial(),...result.draft}}render();say('Workspace access through '+new Date(result.expires).toLocaleDateString())}
$('save').onclick=async()=>{if(!user)return $('login').showModal();try{await workspace(true);say('CV saved.')}catch(e){say(e.message)}};
$('account').onclick=async()=>{if(!user)return $('login').showModal();if(!confirm('Sign out and clear the draft on this screen?'))return;const {error}=await db.auth.signOut({scope:'local'});if(error)return say(error.message);location.reload()};
$('closeLogin').onclick=()=>$('login').close();$('auth').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;try{if(!db)throw Error('Account service could not load.');let credentials={email:$('email').value,password:$('password').value};let {data,error}=e.submitter.value==='up'?await db.auth.signUp({...credentials,options:{emailRedirectTo:location.href.split('#')[0]}}):await db.auth.signInWithPassword(credentials);if(error)throw error;if(!data.session){$('message').textContent='Check your email to confirm, then sign in here.';return}await enter(data.user);$('password').value='';$('login').close()}catch(err){$('message').textContent=err.message}finally{busy=false}};
render();if(db){try{let {data}=await db.auth.getSession();await enter(data.session?.user)}catch(e){say(e.message)}}
</script></html>
