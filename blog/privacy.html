<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://gckaucdwkyhmctfnimbb.supabase.co; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Privacy | Md Shahin Alam</title><link rel="canonical" href="https://shahin4l.github.io/blog/privacy.html"><link rel="stylesheet" href="/css/platform.css"><script src="/js/hub-theme.js"></script><link rel="stylesheet" href="/css/global-theme.css"></head><body><main id="main" class="container article"><h1 data-en="A small privacy note." data-bn="গোপনীয়তা সম্পর্কে।"></h1><p data-en="Comments collect your name, email, optional website and message. Approved names and messages are public. Email is private and retained until the comment is deleted. Your website is not displayed publicly." data-bn="মন্তব্যের জন্য নাম, ইমেইল, ঐচ্ছিক ওয়েবসাইট ও বার্তা নেওয়া হয়। অনুমোদিত নাম ও বার্তা প্রকাশিত হয়। ইমেইল গোপন থাকে এবং মন্তব্য মুছলে মুছে যায়। ওয়েবসাইট প্রকাশ করা হয় না।"></p><p data-en="A random browser identifier prevents simple repeated reactions. It and your language choice are stored on your device. Clearing browser storage resets them. No advertising or analytics trackers are added." data-bn="একই ব্রাউজারে বারবার reaction ঠেকাতে একটি এলোমেলো শনাক্তকারী এবং ভাষা নির্বাচন আপনার ডিভাইসে রাখা হয়। ব্রাউজারের তথ্য মুছলে এগুলো রিসেট হয়। কোনো বিজ্ঞাপন বা analytics tracker যোগ করা হয়নি।"></p><p data-en="For spam prevention, Supabase processes your IP address and retains a one-way, salted hash briefly in abuse-control records. These records are removed on later submissions after one day. Hosting providers may retain their own technical logs." data-bn="স্প্যাম প্রতিরোধে Supabase আপনার IP প্রক্রিয়াকরণ করে একটি একমুখী salted hash সাময়িকভাবে রাখে। এক দিন পার হলে পরবর্তী submission-এর সময় তা মুছে যায়। হোস্টিং সেবা তাদের নিজস্ব technical log রাখতে পারে।"></p><p data-en="GitHub Pages hosts the website; Supabase stores blog content and comments. Google Fonts supplies typefaces. Article images and external links may contact their respective providers. Do not submit passwords or confidential workplace information." data-bn="ওয়েবসাইট GitHub Pages-এ, ব্লগ ও মন্তব্য Supabase-এ থাকে। Google Fonts থেকে ফন্ট আসে। বাইরের ছবি ও লিংক সংশ্লিষ্ট সেবায় সংযোগ করতে পারে। পাসওয়ার্ড বা গোপন কর্মক্ষেত্রের তথ্য জমা দেবেন না।"></p><p data-en="To request deletion, contact shahin4l.bd@gmail.com with the article link, comment name and date." data-bn="মন্তব্য মুছতে লেখার লিংক, মন্তব্যের নাম ও তারিখসহ shahin4l.bd@gmail.com-এ যোগাযোগ করুন।"></p></main><script type="module" src="/js/privacy.js"></script></body></html>
