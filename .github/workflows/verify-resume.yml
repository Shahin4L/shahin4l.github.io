name: Verify Resume Builder
on:
  push:
    branches: ['feature/resume-builder-isolated']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm test
      - run: python3 tests/build_blog_test.py
      - run: python3 tests/industry_news_test.py
      - run: python3 tests/resume_readiness.py
      - run: python3 scripts/package_pages.py
