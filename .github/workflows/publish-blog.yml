name: Publish portfolio and journal
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: ['(root)']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate source
        run: |
          npm run check
          npm test
          python3 tests/build_blog_test.py
      - name: Export published content only
        run: python3 scripts/build_blog.py
      - name: Commit generated article pages
        run: |
          git config user.name 'journal-publisher[bot]'
          git config user.email 'journal-publisher[bot]@users.noreply.github.com'
          git add blog sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Publish journal pages and refresh sitemap'
            git push
          fi
      - name: Package public website
        run: python3 scripts/package_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
