name: Verify engagement endpoint
on:
  push:
    branches: ['repair/engagement-formula-lab-20261117']
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check && npm test
      - run: python3 tests/engagement_http.py
