<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resource Tracker Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f7;color:#162e43;font:16px system-ui}main{max-width:900px;margin:auto;padding:clamp(16px,5vw,48px)}form,section{background:white;border:1px solid #d7e2eb;border-radius:16px;padding:22px}label{display:block;margin:12px 0}input,button,select{font:inherit;padding:10px;border:1px solid #97afbd;border-radius:8px}button{background:#115966;color:white;cursor:pointer}button:focus-visible{outline:3px solid #198095;outline-offset:3px}input{width:min(100%,380px);display:block;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px}.grid div{padding:14px;background:#edf5f5;border-radius:10px}.grid strong{display:block;font-size:26px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:10px;border-bottom:1px solid #d7e2eb}@media(max-width:360px){th,td{padding:6px}}</style><main><h1>Resource Tracker Demo</h1><p>Sample workforce planning data</p><form id="login"><p>Use <strong>demo@example.invalid</strong> and code <strong>123456</strong>.</p><label>Email<input type="email" id="email" required></label><label>Demo code<input id="code" inputmode="numeric" pattern="[0-9]{6}" required></label><button>Sign in</button><p id="status" aria-live="polite"></p></form><section id="app" hidden><button id="logout">Sign out</button><h2>Workforce and capacity</h2><label>Team <select id="team"><option value="">All teams</option><option>Sorting</option><option>Returns</option></select></label><div class="grid" id="stats"></div><h3>Team breakdown</h3><table><thead><tr><th scope="col">Team</th><th scope="col">Active</th><th scope="col">Capacity / hr</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>
const byId=id=>document.getElementById(id);
const fixture=[{team:'Sorting',active:9,total:10,capacity:1080},{team:'Returns',active:4,total:5,capacity:360}];
function render(){
 const rows=fixture.filter(item=>!byId('team').value||item.team===byId('team').value);
 const totals=key=>rows.reduce((sum,item)=>sum+item[key],0);
 byId('stats').innerHTML=[['Total staff',totals('total')],['Active staff',totals('active')],['Capacity / hr',totals('capacity')]].map(([label,value])=>'<div><strong>'+value+'</strong>'+label+'</div>').join('');
 byId('rows').innerHTML=rows.map(item=>'<tr><th scope="row">'+item.team+'</th><td>'+item.active+'</td><td>'+item.capacity+'</td></tr>').join('');
}
byId('login').onsubmit=event=>{event.preventDefault();if(byId('email').value.trim().toLowerCase()!=='demo@example.invalid'||byId('code').value!=='123456'){byId('status').textContent='Enter the demo email and code shown above.';return;}byId('status').textContent='';byId('login').hidden=true;byId('app').hidden=false;render();byId('logout').focus();};
byId('team').onchange=render;
byId('logout').onclick=()=>{byId('app').hidden=true;byId('login').hidden=false;byId('login').reset();byId('team').value='';byId('email').focus();};
</script></html>
