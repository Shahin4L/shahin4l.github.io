<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://gckaucdwkyhmctfnimbb.supabase.co; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Editor | Md Shahin Alam</title><link rel="stylesheet" href="/css/platform.css"><script src="/js/hub-theme.js"></script><link rel="stylesheet" href="/css/global-theme.css"></head><body><main id="main" class="container"><div id="notice" class="notice" role="status" tabindex="-1" hidden></div><section id="auth-check" class="login" role="status"><p id="auth-state" data-en="Restoring your workspace…" data-bn="আপনার ড্যাশবোর্ড প্রস্তুত হচ্ছে…">Restoring your workspace…</p><button id="retry-session" type="button" hidden data-en="Try again" data-bn="আবার চেষ্টা করুন"></button></section><noscript>Enable JavaScript to sign in / লগইন করতে JavaScript চালু করুন।</noscript><section class="login" id="login" hidden><span class="eyebrow" data-en="PRIVATE EDITORIAL WORKSPACE" data-bn="ব্যক্তিগত সম্পাদনা ডেস্ক"></span><h1 data-en="Welcome back." data-bn="স্বাগতম।"></h1><p data-en="Sign in with your authorized administrator account." data-bn="অনুমোদিত অ্যাডমিন অ্যাকাউন্ট দিয়ে লগইন করুন।"></p><form id="login-form"><label for="email" data-en="Email" data-bn="ইমেইল"></label><input id="email" type="email" required autocomplete="username"><label for="password" data-en="Password" data-bn="পাসওয়ার্ড"></label><input id="password" type="password" required autocomplete="current-password" minlength="8"><div class="actions"><button type="submit" data-en="Sign in" data-bn="লগইন"></button><button id="reset" type="button" class="secondary" data-en="Forgot password" data-bn="পাসওয়ার্ড ভুলে গেছেন"></button></div></form></section><section id="recovery" class="login" hidden><h1 data-en="New password" data-bn="নতুন পাসওয়ার্ড"></h1><form id="recovery-form"><label for="new-password" data-en="New password (at least 12 characters)" data-bn="নতুন পাসওয়ার্ড (অন্তত ১২ অক্ষর)"></label><input id="new-password" type="password" minlength="12" required autocomplete="new-password"><button type="submit" data-en="Save password" data-bn="পাসওয়ার্ড সংরক্ষণ"></button></form></section><section id="dashboard" class="editor" hidden><div class="eyebrow" data-en="EDITORIAL DESK" data-bn="সম্পাদনা ডেস্ক"></div><h1 data-en="Your publishing room." data-bn="আপনার প্রকাশনা ডেস্ক।"></h1><div class="actions"><button id="new-post" data-en="+ New article" data-bn="+ নতুন লেখা"></button><button id="backup" class="secondary" data-en="Download content backup" data-bn="কনটেন্ট ব্যাকআপ নামান"></button><button id="logout" class="secondary" data-en="Sign out" data-bn="লগআউট"></button></div><div id="stats" class="stats"></div><div class="tabs"><button data-tab="articles" data-en="Articles" data-bn="লেখা"></button><button data-tab="moderation" data-en="Moderation" data-bn="মন্তব্য অনুমোদন"></button><button data-tab="website-content">Website Content</button><button data-tab="settings" data-en="Website & categories" data-bn="ওয়েবসাইট ও বিভাগ"></button></div><section id="articles" class="panel"><h2 data-en="Article library" data-bn="লেখার তালিকা"></h2><div id="post-list" class="editor-list"></div></section><section id="moderation" class="panel" hidden><h2 data-en="Comment moderation" data-bn="মন্তব্য যাচাই"></h2><p data-en="Guest email addresses are kept in private storage and excluded from this interface." data-bn="অতিথির ইমেইল গোপন স্থানে রাখা হয় এবং এখানে দেখানো হয় না।"></p><label for="moderation-filter" data-en="Status" data-bn="অবস্থা"></label><select id="moderation-filter"><option>pending</option><option>approved</option><option>rejected</option><option>spam</option><option value="all">All / সব</option></select><div id="comment-list" class="editor-list"></div></section><section id="settings" class="panel" hidden><h2 data-en="Announcement" data-bn="ঘোষণা"></h2><form id="announcement-form"><label for="announcement-en">English</label><textarea id="announcement-en" maxlength="1000"></textarea><label for="announcement-bn">বাংলা</label><textarea id="announcement-bn" maxlength="1000"></textarea><button data-en="Save announcement" data-bn="ঘোষণা সংরক্ষণ"></button></form><h2 data-en="Categories" data-bn="বিভাগ"></h2><p id="category-list"></p><form id="category-form"><label for="category-en">English</label><input id="category-en" required maxlength="60"><label for="category-bn">বাংলা</label><input id="category-bn" required maxlength="80"><button data-en="Save category" data-bn="বিভাগ সংরক্ষণ"></button></form><h2 data-en="Recent activity" data-bn="সাম্প্রতিক কার্যক্রম"></h2><div id="activity"></div></section><section id="website-content" class="panel" hidden><h2>Website Content / ওয়েবসাইটের কনটেন্ট</h2><p>Edit public portfolio text and project descriptions in English and Bengali. Use empty values to restore the original copy.</p><div class="actions"><a class="secondary" href="/" target="_blank" rel="noopener">Open public portfolio</a><button type="button" id="copy-refresh" class="secondary">Refresh fields</button></div><label for="copy-group">Section / বিভাগ</label><select id="copy-group"></select><label for="copy-search">Search text</label><input type="search" id="copy-search" placeholder="Search title, description or other text"><label for="copy-list">Choose a text field</label><select id="copy-list" size="8" style="width:100%"></select><form id="copy-form" hidden><label>Original text</label><p id="copy-original" style="white-space:pre-wrap;overflow-wrap:anywhere"></p><label for="copy-en">English text</label><textarea id="copy-en" rows="5" maxlength="3000"></textarea><label for="copy-bn">বাংলা লেখা</label><textarea id="copy-bn" rows="5" maxlength="3000"></textarea><div class="actions"><button id="copy-save">Save to website</button><button type="button" id="copy-reset" class="secondary">Restore default text</button></div></form><p id="copy-status" role="status"></p></section><section id="editor" class="panel" hidden><h2 data-en="Article editor" data-bn="লেখা সম্পাদনা"></h2><form id="post-form"><input name="id" type="hidden"><div class="row"><div><label for="title">Title · English *</label><input id="title" name="title" required maxlength="200"></div><div><label for="title-bn">শিরোনাম · বাংলা</label><input id="title-bn" name="title_bn" maxlength="200"></div></div><label for="slug">URL slug *</label><input id="slug" name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="120"><p class="meta" data-en="Use lowercase English words separated by hyphens. Keep a published URL unchanged to preserve links." data-bn="ছোট ইংরেজি অক্ষর ও হাইফেন ব্যবহার করুন। প্রকাশিত লেখার লিংক অক্ষত রাখতে slug অপরিবর্তিত রাখুন।"></p><div class="row"><div><label for="excerpt">Summary · English</label><textarea id="excerpt" name="excerpt" maxlength="1000"></textarea></div><div><label for="excerpt-bn">সারসংক্ষেপ · বাংলা</label><textarea id="excerpt-bn" name="excerpt_bn" maxlength="1000"></textarea></div></div><label for="content">Content · English (Markdown) *</label><textarea id="content" name="content" required rows="16" maxlength="200000"></textarea><label for="content-bn">মূল লেখা · বাংলা (Markdown)</label><textarea id="content-bn" name="content_bn" rows="12" maxlength="200000"></textarea><p class="meta" data-en="Markdown: ## Heading, **bold**, *italic*, [link](https://...), ![caption](https://image...), lists, quotes, tables and fenced code. Raw HTML is displayed as text." data-bn="Markdown: ## শিরোনাম, **বোল্ড**, *ইটালিক*, [লিংক](https://...), ![ক্যাপশন](https://image...)। HTML কোড লেখা হিসেবেই দেখানো হয়।"></p><div class="row"><div><label for="post-category">Category / বিভাগ</label><select id="post-category" name="category"></select></div><div><label for="tags">Tags / ট্যাগ (comma separated)</label><input id="tags" name="tags" maxlength="500"></div></div><label for="cover-url">Cover image URL / কভার ছবির লিংক</label><input id="cover-url" name="cover_url" type="url"><label for="upload">Upload JPEG, PNG or WebP (max 2 MB)</label><input id="upload" type="file" accept="image/jpeg,image/png,image/webp"><div class="row"><div><label for="seo-title">SEO title · English</label><input id="seo-title" name="seo_title" maxlength="200"><label for="seo-description">SEO description · English</label><textarea id="seo-description" name="seo_description" maxlength="500"></textarea></div><div><label for="seo-title-bn">SEO শিরোনাম · বাংলা</label><input id="seo-title-bn" name="seo_title_bn" maxlength="200"><label for="seo-description-bn">SEO বিবরণ · বাংলা</label><textarea id="seo-description-bn" name="seo_description_bn" maxlength="500"></textarea></div></div><div class="row"><div><label for="status">Status / অবস্থা</label><select id="status" name="status"><option value="draft">Draft / খসড়া</option><option value="published">Published / প্রকাশিত</option></select></div><div><label for="publish-at">Publish at / প্রকাশের সময় (আপনার স্থানীয় সময়)</label><input id="publish-at" name="published_at" type="datetime-local"></div></div><label><input type="checkbox" name="featured" style="width:auto"> Featured / নির্বাচিত</label><label><input type="checkbox" name="comments_enabled" style="width:auto" checked> Comments enabled / মন্তব্য চালু</label><div class="actions"><button type="submit" data-en="Save article" data-bn="লেখা সংরক্ষণ"></button><button id="preview" type="button" class="secondary" data-en="Preview" data-bn="প্রিভিউ"></button><button id="cancel-edit" type="button" class="secondary" data-en="Close editor" data-bn="সম্পাদনা বন্ধ"></button></div></form><div id="preview-content" class="prose" hidden></div></section></section></main><script type="module" src="/js/admin.js?v=content-1"></script></body></html>
